[project]
name = "better-activity-monitor"
version = "0.1.0"
description = "Lightweight GTK4/libadwaita system monitor: hardware overview, live stats and history charts"
requires-python = ">=3.11"
# PyGObject, GTK 4 and libadwaita come from the distribution (python3-gobject, typelib-1_0-Adw-1).
dependencies = []

[project.scripts]
better-activity-monitor = "better_activity_monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["better_activity_monitor"]
